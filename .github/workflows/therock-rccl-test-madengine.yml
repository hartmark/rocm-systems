name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    defaults:
      run:
        shell: bash
    env:
      RESULTS_DIR: "/apps/rccl-ci/madengine/perf"
      WORK_DIR: "/apps/rccl-ci/madengine/workdir/${{ github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
    steps:
      - name: Probe candidate paths
        run: |
          set +e
          echo "=== identity ==="
          id; hostname; echo "workspace=${{ github.workspace }}"

          echo; echo "=== candidate WORK_DIR ==="
          mkdir -p "${WORK_DIR}/slurm_output" && touch "${WORK_DIR}/perf.csv" \
            && echo "  OK writable: ${WORK_DIR}" || echo "  FAIL: ${WORK_DIR}"
          ls -ld "${WORK_DIR}" 2>&1

          echo; echo "=== candidate RESULTS_DIR (must persist across runs) ==="
          mkdir -p "${RESULTS_DIR}/runs/${{ github.run_id }}" \
            && echo '{"probe":true}' >> "${RESULTS_DIR}/madengine_results.jsonl" \
            && echo "  OK writable: ${RESULTS_DIR}" || echo "  FAIL: ${RESULTS_DIR}"
          ls -ld "${RESULTS_DIR}" "${RESULTS_DIR}/madengine_results.jsonl" 2>&1

          echo; echo "=== OUTPUT_ARTIFACTS_DIR in the workspace ==="
          mkdir -p "${OUTPUT_ARTIFACTS_DIR}/lib" && touch "${OUTPUT_ARTIFACTS_DIR}/lib/librccl.so" \
            && echo "  OK writable: $(readlink -f "${OUTPUT_ARTIFACTS_DIR}")" \
            || echo "  FAIL: ${OUTPUT_ARTIFACTS_DIR}"

          echo; echo "=== artifact fetch reaches S3 without AWS creds ==="
          python3 -c "
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          c = boto3.client('s3', config=Config(signature_version=UNSIGNED))
          r = c.list_objects_v2(Bucket='therock-artifacts', MaxKeys=1)
          print('  anonymous S3 list ok, KeyCount=%s' % r.get('KeyCount'))
          " 2>&1 | tail -3

          echo; echo "=== cleanup ==="
          rm -rf "${WORK_DIR}" "${RESULTS_DIR}/runs/${{ github.run_id }}" \
                 "${RESULTS_DIR}/madengine_results.jsonl" "${OUTPUT_ARTIFACTS_DIR}" \
            && echo "  done"
          exit 0

